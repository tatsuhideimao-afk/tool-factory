<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>JSON整形・検証ツール</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>JSON整形・検証</h1>
      <textarea id="input" rows="8" spellcheck="false" placeholder='{"a":1}'></textarea>
      <div class="controls">
        <select id="indent">
          <option value="2">スペース2</option>
          <option value="4">スペース4</option>
          <option value="tab">タブ</option>
        </select>
        <label><input type="checkbox" id="sort" />キー順</label>
        <button id="format" type="button">整形</button>
        <button id="minify" type="button">圧縮</button>
        <button id="copy" type="button">コピー</button>
      </div>
      <textarea id="output" rows="8" spellcheck="false" readonly></textarea>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="note">入力したデータは外部に送信されません。すべてブラウザ内で処理されます。</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
