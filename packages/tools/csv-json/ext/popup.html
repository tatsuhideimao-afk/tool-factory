<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>CSV⇄JSON変換ツール</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>CSV⇄JSON変換</h1>
      <textarea id="input" rows="8" spellcheck="false" placeholder="name,age&#10;alice,30"></textarea>
      <div class="controls">
        <select id="direction">
          <option value="csv2json">CSV → JSON</option>
          <option value="json2csv">JSON → CSV</option>
        </select>
        <select id="delimiter">
          <option value=",">カンマ</option>
          <option value="&#9;">タブ</option>
          <option value=";">セミコロン</option>
        </select>
        <label><input type="checkbox" id="header" checked />ヘッダあり</label>
        <button id="convert" type="button">変換</button>
        <button id="copy" type="button">コピー</button>
      </div>
      <textarea id="output" rows="8" spellcheck="false" readonly></textarea>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="note">入力したデータは外部に送信されません。すべてブラウザ内で処理されます。</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
