name: Deploy (Web)

# Web版の公開は全自動（仕様 1章）。
# Pages のビルド回数上限に当てないよう、main への push か手動実行のときだけ動かす。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: 品質ゲート → Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # 3つ全て通らなければデプロイしない（仕様 2章・5.3）
      - name: 品質ゲート
        run: pnpm gates

      - name: 資材を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm assets

      - name: Cloudflare Pages へデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:web

      - name: 台帳の更新をコミット
        run: |
          if [ -z "$(git status --porcelain -- data apps/web/public)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data apps/web/public
          git commit -m "chore(deploy): 台帳と資材を更新"
          git push
