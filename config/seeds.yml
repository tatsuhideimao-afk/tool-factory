# 01-research の種キーワード（Phase 2 で使用）。
# 仕様 5.1: オーナーが初期30語だけ手で書く。
# 条件: 「動詞＋対象」の形であること、ブラウザ内で完結する処理であること。
seeds:
  - PDF 結合
  - PDF 分割
  - PDF 圧縮
  - 画像 リサイズ
  - 画像 圧縮
  - 画像 形式変換
  - CSV JSON 変換
  - JSON 整形
  - YAML JSON 変換
  - Base64 エンコード
  - URL エンコード
  - テキスト 差分
  - 文字数 カウント
  - 正規表現 テスト
  - QRコード 作成
  - カラーコード 変換
  - 単位 変換
  - 日付 計算
  - タイムスタンプ 変換
  - パスワード 生成
  - UUID 生成
  - ハッシュ 計算
  - Markdown HTML 変換
  - HTML エスケープ
  - SQL 整形
  - 全角 半角 変換
  - 文字コード 判定
  - EXIF 削除
  - 音声 形式変換
  - 動画 GIF 変換

# 除外語（このいずれかを含む検索語は候補化しない）
# 理由: サーバ処理が必要 / 個人情報を扱う / 規約リスクが高い
exclude:
  - ログイン
  - パスワード管理
  - 保存
  - クラウド
  - 共有リンク
  - ダウンロード 代行
  - 動画 ダウンロード
